<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispensary Management & Logistics System - Capabilities</title>
    <!-- Google Fonts: Outfit & Inter for premium, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <!-- Header -->
    <header class="navbar">
        <div class="logo-area">
            <span class="logo-dot"></span>
            <span class="logo-text">Dispensary Management &<span class="highlight"> Logistics</span></span>
            <span class="badge">Capabilities</span>
        </div>
        <div class="header-controls">
            <button id="togglePresenterBtn" class="control-btn toggle-presenter-btn" title="Toggle Presenter Mode (P)">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Presenter Mode</span>
            </button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="presentation-container presenter-mode-active" id="mainLayout">
        <!-- Slide View (Left Pane) -->
        <section class="slide-pane">
            <div class="slide-card-wrapper">
                <div class="slide-card" id="slideCard">
                    <!-- Slide content injected here by JavaScript -->
                </div>
            </div>
        </section>

        <!-- Sidebar Toggle Tab attached to the sidebar edge -->
        <button id="sidebarToggleTab" class="sidebar-toggle-tab" title="Toggle Presenter Desk (P)">
            <svg id="tabArrowIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

        <!-- Presenter Panel (Right Pane) -->
        <aside class="presenter-sidebar" id="presenterSidebar">
            <div class="sidebar-content" id="sidebarContentWrapper">
                <div class="advice-section collapsible-section active">
                    <h4 class="section-title">
                        <span>Visual Suggestion Explanation</span>
                        <span class="accordion-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </span>
                    </h4>
                    <div class="advice-box accordion-content" id="visualAdviceContent">
                        <!-- Visual details injected here -->
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Footer Controls -->
    <footer class="footer-controls">
        <div class="keyboard-legend">
            <span>Use <kbd>←</kbd> <kbd>→</kbd> or <kbd>Space</kbd> to navigate</span>
        </div>

        <div class="slide-navigation">
            <button id="prevBtn" class="nav-btn" title="Previous Slide">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>

            <div class="progress-dots" id="progressDotsContainer">
                <!-- Dot navigation generated by JavaScript -->
            </div>

            <button id="nextBtn" class="nav-btn" title="Next Slide">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>

        <div class="quick-status">
            <span id="slideStatusIndicator">Slide 1 / 7</span>
        </div>
    </footer>

    <!-- Image Lightbox Modal -->
    <div id="imageLightbox" class="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img class="lightbox-content" id="lightboxImage" alt="Enlarged Visual Preview">
    </div>

    <!-- Interactive JS code -->
    <script src="app.js"></script>
</body>
</html>
